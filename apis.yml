name: Navigate
description: 'Navigate (NavigateAI) is a proptech company building an AI copilot for
  the physical world, helping field teams across construction, commercial real estate,
  homebuilding, data centers, and the trades complete projects faster, at higher quality,
  and lower cost. Its platform combines AI Capture for mobile visual documentation
  of project features and quality, AI Insights for on-demand expert coaching and upskilling,
  and AI Workflows for automating documentation and communication. Co-founded by Eric
  Wu and David Sinsky, Navigate is backed by Khosla Ventures, Affinity Partners, and
  Fifth Wall, with strategic investors including Tishman Speyer, Lennar, and Helix
  Electric. Navigate publishes a real external REST API (OpenAPI 3.1, bearer API-key
  auth) at https://api.navigateai.co for programmatically managing locations, visits,
  video captures, scopes, line items, work orders, and vendors.'
